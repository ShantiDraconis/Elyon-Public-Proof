name: ELYON FINAL_EXTERNAL preparatory freeze

on:
  push:
    branches: [ main ]
    paths:
      - 'certs/final_external/v1/manifest.json'
      - 'certs/final_external/v1/README.md'
      - 'certs/final_external/v1/provenance.json'
      - 'certs/final_external/v1/gate_ledger.json'
      - 'certs/final_external/v1/axiom_footprint.json'
      - 'certs/final_external/v1/reproducibility.md'
      - 'certs/final_external/v1/status.json'
      - 'certs/final_external/v1/revocation.json'
      - 'certs/final_external/v1/freeze.sh'
      - '.github/workflows/elyon-final-external-preparatory-freeze.yml'

permissions:
  contents: write

jobs:
  freeze-preparatory:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run fail-closed preparatory freeze
        run: |
          set -euo pipefail
          cd certs/final_external/v1
          bash freeze.sh
          test -s SHA256SUMS
          test -s PREPARATORY_ROOT
          grep -q '^RESULT=FROZEN_PREPARATORY$' <(bash freeze.sh)
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          s=json.load(open('status.json'))
          assert m['root']['FINAL_ROOT'] is None
          assert m['issuance_gate']['FINAL_EXTERNAL_ISSUED'] is False
          assert s['issuance']['FINAL_EXTERNAL_ISSUED'] is False
          assert m['final_proof']['display']=='0/7'
          PY

      - name: Verify generated hashes
        run: |
          set -euo pipefail
          cd certs/final_external/v1
          sha256sum -c SHA256SUMS
          expected="$(sha256sum SHA256SUMS | awk '{print $1}')"
          actual="$(tr -d '\n\r ' < PREPARATORY_ROOT)"
          test "$expected" = "$actual"
          echo "PREPARATORY_ROOT=$actual"

      - name: Commit preparatory hash outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certs/final_external/v1/SHA256SUMS certs/final_external/v1/PREPARATORY_ROOT
          if git diff --cached --quiet; then
            echo "HASH_OUTPUTS_UNCHANGED=PASS"
            exit 0
          fi
          git commit -m "elyon: freeze preparatory package hashes"
          git push
