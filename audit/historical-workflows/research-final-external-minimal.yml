name: research final external minimal
# trigger: claim7 target2b fix

on:
  push:
    branches:
      - research/seven-certs-final-20260924
      - seven-bridge/claim5-6
      - seven-bridge/claim7-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update

      - name: Verify seven-bridge sources
        shell: bash
        run: |
          set -euo pipefail
          lean_files=(
            lean/MCore/Real/BridgeSeven.lean
            lean/MCore/Real/Claim3PersistentFamily.lean
            lean/MCore/Real/Claim4NormalizedProgress.lean
            lean/MCore/Real/P02RestrictionFamilyAudit.lean
            lean/MCore/Real/Claim6CNFDeficitAudit.lean
            lean/MCore/Real/Claim7VariableCoverage.lean
            lean/MCore/Real/TotalVariableCoverageObligationNorm.lean
            lean/MCore/Real/SevenRealProducer.lean
            lean/MCore/Real/SevenExternalCertificate.lean
            lean/MCore/Real/FinalChain.lean
          )
          for f in "${lean_files[@]}"; do test -f "$f"; done
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${lean_files[@]}"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${lean_files[@]}"

      - name: Kernel build seven-bridge
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.Real.Claim3PersistentFamily
          lake build MCore.Real.Claim4NormalizedProgress
          lake build MCore.Real.P02RestrictionFamilyAudit
          lake build MCore.Real.Claim6CNFDeficitAudit
          lake build MCore.Real.Claim7VariableCoverage
          lake build MCore.Real.TotalVariableCoverageObligationNorm
          lake build MCore.Real.BridgeSeven
          lake build MCore.Real.SevenRealProducer
          lake build MCore.Real.SevenExternalCertificate
          lake build MCore.Real.FinalChain
