name: M-Core Actions Smoke

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mcore-actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "MCORE_ACTIONS_SMOKE_GREEN"
          git rev-parse HEAD
