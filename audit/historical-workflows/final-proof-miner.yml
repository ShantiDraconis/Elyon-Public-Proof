name: Final Proof Miner

# M-Core sources live under lean/; lakefile.lean sets srcDir accordingly.

on:
  push:
    branches: [ main ]
    paths:
      - 'final-proof/**'
      - 'lean/MCore/FinalProof*.lean'
      - 'imports/**'
      - 'certs/final_external/**'
      - 'scripts/**'
      - '.github/workflows/final-proof-miner.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: final-proof-miner
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run endpoint miner
        run: python3 scripts/final_proof_miner.py

      - name: Link all seven FINAL_PROOF chains
        run: python3 scripts/global_final_proof_linker.py

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean kernel audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build MCore.FinalProofRegistry MCore.FinalProofFirewall
          lake build
          {
            echo "KERNEL_BUILD_GREEN"
            echo "toolchain=$(cat lean-toolchain)"
          } | tee evidence/kernel_audit.txt

      - name: Reject placeholders in Lean sources
        shell: bash
        run: |
          set -euo pipefail
          if find . -name '*.lean' -type f | grep -q .; then
            if grep -RInE '\b(sorry|admit|sorryAx)\b' --include='*.lean' .; then
              echo "FAIL_CLOSED: Lean placeholder detected" | tee evidence/hygiene_status.txt
              exit 1
            fi
          fi
          echo "HYGIENE_GREEN" | tee evidence/hygiene_status.txt

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-proof-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "final-proof-miner[bot]"
          git config user.email "final-proof-miner[bot]@users.noreply.github.com"
          git add evidence/
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "evidence: refresh FINAL_PROOF dependency mining"
          git push
