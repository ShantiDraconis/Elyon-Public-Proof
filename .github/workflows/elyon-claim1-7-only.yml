name: ELYON Claim1-7 Only

on:
  push:
    branches:
      - elyon/claim1-7-only-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim1-7-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update

      - name: Verify audit package
        shell: bash
        run: |
          set -euo pipefail
          test -f lean/MCore/Real/Claim1To7Only.lean
          test -f certs/elyon_claim1_7_only/manifest.json
          test -f certs/elyon_claim1_7_only/CLAIM1_7_CERTIFICATE.json
          test -f certs/elyon_claim1_7_only/FINAL_ISSUANCE.json
          test -f certs/elyon_claim1_7_only/AUDIT_MANIFEST.json
          test -f certs/elyon_claim1_7_only/SHA256SUMS
          test -f certs/elyon_claim1_7_only/REPRODUCE.md
          test -f certs/elyon_claim1_7_only/RELEASE_MANIFEST.json
          sha256sum -c certs/elyon_claim1_7_only/SHA256SUMS
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/Real/Claim1To7Only.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/Claim1To7Only.lean

      - name: Kernel build Claim1-7 only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.Claim1To7Only
