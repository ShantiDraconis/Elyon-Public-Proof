name: FINAL_FAIL closed-center HARD

on:
  push:
    branches:
      - attack/final-fail-closed-center-dynamics-20260921
  pull_request:
    paths:
      - 'lean/MCore/FinalFail/**'
      - 'FINAL_FAIL_TRIADIC_CALCULUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-center-hard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fail-closed source hygiene
        run: |
          set -euo pipefail
          files=(
            lean/MCore/FinalFail/TriadicObstructionCalculus.lean
            lean/MCore/FinalFail/MinimalOpenBridge.lean
            lean/MCore/FinalFail/ClosedCenterHard.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"; then
            exit 1
          fi

      - name: Kernel compile triadic HARD
        run: |
          set -euo pipefail
          cd lean
          export LEAN_PATH="$PWD"
          lean -o MCore/FinalFail/TriadicObstructionCalculus.olean MCore/FinalFail/TriadicObstructionCalculus.lean
          lean -o MCore/FinalFail/MinimalOpenBridge.olean MCore/FinalFail/MinimalOpenBridge.lean
          lean MCore/FinalFail/ClosedCenterHard.lean 2>&1 | tee /tmp/closed-center-hard.log

      - name: Axiom footprint
        run: |
          set -euo pipefail
          test "$(grep -c 'does not depend on any axioms' /tmp/closed-center-hard.log || true)" -ge 4
          if grep -q 'sorryAx' /tmp/closed-center-hard.log; then exit 1; fi
          echo "CLOSED_CENTER_HARD_KERNEL=GREEN"
